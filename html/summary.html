<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Summary</title>
    <link
      rel="shortcut icon"
      href="../assets/icons/favorite-icon.svg"
      type="image/x-icon"
    />

    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="../styles/variables.css" />
    <link rel="stylesheet" href="../styles/layout.css" />
    <link rel="stylesheet" href="../styles/components.css" />
    <link rel="stylesheet" href="../styles/summary.css" />
    <link rel="stylesheet" href="../styles/icons.css" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../styles/legal.css" />
    <script src="../js/session.js"></script>
    <script src="../js/pageHeaderTemplate.js"></script>
    <script src="../script.js"></script>
  </head>

  <body
    class="app-layout"
    onload="
      requireLogin();
      includeHTML();
    "
  >
    <div
      class="shared-template"
      w3-include-html="../templates/template.html"
      data-active-page="summary"
    ></div>
    <main>
      <section class="summary">
        <div class="summary-header">
          <div class="summary-header-title">
            <h1>Join 360</h1>
          </div>
          <div class="separator"></div>
          <div class="summary-header-subtitle">
            <p class="summary-header-subtitle-text">Key Metrics at a Glance</p>
          </div>
        </div>

        <div class="summary-buttons">
          <div class="summary-buttons-to">
            <button class="summary-to-do" onclick="gotoBoard()">
              <div class="summary-to-do-icon">
                <img
                  class="summary-to-do-img"
                  src="../assets/icons/toDo.svg"
                  alt="To-Do Icon"
                />
              </div>
              <div class="summary-to-do-text">
                1
                <div class="summary-to-do-label">To-Do</div>
              </div>
            </button>
        <div class="summary-section">
          <div class="summary-buttons">
            <div class="summary-buttons-to">
              <button class="summary-to-do" onclick="gotoBoard()">
                <div class="summary-to-do-icon">
                  <img
                    class="summary-to-do-img"
                    src="../assets/icons/to_do .svg"
                    alt="To-Do Icon"
                  />
                </div>
                <div class="summary-to-do-text">
                  1
                  <div class="summary-to-do-label">To-Do</div>
                </div>
              </button>

              <button class="summary-to-do" onclick="gotoBoard()">
                <div class="summary-to-do-icon">
                  <img
                    class="summary-to-do-img"
                    src="../assets/icons/done.svg"
                    alt="Done Icon"
                  />
                </div>
                <div class="summary-to-do-text">
                  1
                  <div class="summary-to-do-label">Done</div>
                </div>
              </button>
            </div>

          <div class="summary-buttons-urgent">
            <button class="summary-metrics" onclick="gotoBoard()">
              <div class="summary-metrics-text">
                <img src="../assets/icons/urgent.svg" alt="Urgent Icon" />
                <div class="summary-to-do-text">
                  1
                  <div class="summary-to-do-label">To-Do</div>
                </div>
              </button>

              <button class="summary-to-do" onclick="gotoBoard()">
                <div class="summary-to-do-icon">
                  <img
                    class="summary-to-do-img"
                    src="../assets/icons/done.svg"
                    alt="Done Icon"
                  />
                </div>
                <div class="summary-to-do-text">
                  1
                  <div class="summary-to-do-label">Done</div>
                </div>
              </button>
            </div>

            <div class="summary-buttons-urgent">
              <button class="summary-metrics" onclick="gotoBoard()">
                <div class="summary-metrics-text">
                  <img src="../assets/icons/urgent.svg" alt="Urgent Icon" />
                  <div class="summary-to-do-text">
                    1
                    <div class="summary-to-do-label">Urgent</div>
                  </div>
                </div>
                <div class="separator-vertical"></div>
                <div class="summary-metrics-content">
                  October 16, 2022
                  <div class="summary-to-do-label">Upcoming Deadline</div>
                </div>
              </button>
            </div>

            <div class="summary-buttons-boards">
              <button class="summary-settings" onclick="gotoBoard()">
                <div class="summary-to-do-text">
                  5
                  <div class="summary-to-do-label">Tasks in Boards</div>
                </div>
              </button>
              <button class="summary-settings" onclick="gotoBoard()">
                <div class="summary-to-do-text">
                  2
                  <div class="summary-to-do-label">Tasks In Progress</div>
                </div>
              </button>
              <button class="summary-settings" onclick="gotoBoard()">
                <div class="summary-to-do-text">
                  2
                  <div class="summary-to-do-label">Awaiting Feedback</div>
                </div>
              </button>
            </div>
          </div>
          <section class="summary-section-extra">
            good morning,
            <div class="summary-section-extra-content">
              Alexander Zerbian
            </div>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
