<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts</title>
    <link rel="shortcut icon" href="../assets/icons/favorite-icon.svg" type="image/x-icon">

    <link rel="stylesheet" href="../styles/fonts.css">
    <link rel="stylesheet" href="../styles/variables.css">
    <link rel="stylesheet" href="../styles/layout.css">
    <link rel="stylesheet" href="../styles/components.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../styles/legal.css">
    <link rel="stylesheet" href="../styles/contacts.css">
    <link rel="stylesheet" href="../styles/contactOverlay.css">
    <script src="../js/session.js"></script>
    <script src="../js/pageHeaderTemplate.js"></script>
</head>

<body class="app-layout" onload="requireLogin(); includeHTML()">
    <div class="shared-template" w3-include-html="../templates/template.html" data-active-page="contacts"></div>
    <main class="contacts-page">
        <section class="contact-list">
            <button class="btn btn-primary contact-add-btn">
                Add new contact
                <img src="../assets/icons/personAdd.svg" alt="">
            </button>
            <div id="contactList">
                <div class="contact-letter">A</div>
                <button class="contact-item">
                    <span class="contact-avatar" style="background-color: #29ABE2">AX</span>
                    <span class="contact-info">
                        <span class="contact-name">Alexander X</span>
                        <span class="contact-email">alexander@test.de</span>
                    </span>
                </button>
                <div class="contact-letter">M</div>
                <button class="contact-item active">
                    <span class="contact-avatar" style="background-color: #FF7A00">MJ</span>
                    <span class="contact-info">
                        <span class="contact-name">Marven J</span>
                        <span class="contact-email">marven@test.de</span>
                    </span>
                </button>
                <div class="contact-letter">S</div>
                <button class="contact-item">
                    <span class="contact-avatar" style="background-color: #9327FF">SX</span>
                    <span class="contact-info">
                        <span class="contact-name">Samuel X</span>
                        <span class="contact-email">samuel@test.de</span>
                    </span>
                </button>
            </div>
        </section>

        <section class="contact-content">
            <div class="contacts-headline">
                <h1>Contacts</h1>
                <div class="contacts-headline-line"></div>
                <p>Better with a team</p>
            </div>
            <div id="contactDetails" class="contact-details">
                <div class="contact-details-head">
                    <span class="contact-details-avatar" style="background-color: #FF7A00">MJ</span>
                    <div class="contact-details-title">
                        <h2>Marven J</h2>
                        <div class="contact-actions">
                            <button class="contact-action">
                                <span class="contact-action-icon icon-edit"></span>
                                Edit
                            </button>
                            <button class="contact-action">
                                <span class="contact-action-icon icon-delete"></span>
                                Delete
                            </button>
                        </div>
                    </div>
                </div>
                <h3>Contact Information</h3>
                <div class="contact-details-info">
                    <h4>Email</h4>
                    <a class="contact-email" href="mailto:marven@test.de">marven@test.de</a>
                    <h4>Phone</h4>
                    <p class="contact-phone">+49 2222 8891 00 2</p>
                </div>
            </div>
        </section>
    </main>

    <dialog id="contactOverlay" class="contact-overlay">
        <div class="overlay-aside">
            <img class="overlay-logo" src="../assets/icons/logo.svg" alt="Join logo">
            <h2>Add contact</h2>
            <p>Tasks are better with a team!</p>
            <div class="overlay-line"></div>
        </div>
        <div class="overlay-main">
            <button class="overlay-close" aria-label="Close">
                <span class="overlay-close-icon"></span>
            </button>
            <div class="overlay-avatar">
                <img src="../assets/icons/avatarPlaceholder.svg" alt="">
            </div>
            <form class="overlay-form" novalidate>
                <div class="input-group">
                    <div class="input-wrap">
                        <input id="contactName" type="text" placeholder="Name" aria-label="Name" autocomplete="name" autofocus>
                        <img src="../assets/icons/person.svg" alt="">
                    </div>
                    <span class="error-msg" id="contactNameError" aria-live="polite"></span>
                </div>
                <div class="input-group">
                    <div class="input-wrap">
                        <input id="contactEmail" type="text" placeholder="Email" aria-label="Email" autocomplete="email">
                        <img src="../assets/icons/loginMail.svg" alt="">
                    </div>
                    <span class="error-msg" id="contactEmailError" aria-live="polite"></span>
                </div>
                <div class="input-group">
                    <div class="input-wrap">
                        <input id="contactPhone" type="tel" placeholder="Phone" aria-label="Phone" autocomplete="tel">
                        <img src="../assets/icons/call.svg" alt="">
                    </div>
                    <span class="error-msg" id="contactPhoneError" aria-live="polite"></span>
                </div>
                <div class="overlay-buttons">
                    <button class="btn btn-secondary overlay-cancel" type="button">
                        Cancel
                        <span class="overlay-cancel-icon"></span>
                    </button>
                    <button class="btn btn-primary overlay-submit" type="submit">
                        Create contact
                        <img src="../assets/icons/check.svg" alt="">
                    </button>
                </div>
            </form>
        </div>
    </dialog>
</body>

</html>
