<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts</title>
    <link rel="shortcut icon" href="../assets/icons/favorite-icon.svg" type="image/x-icon">

    <link rel="stylesheet" href="../styles/fonts.css">
    <link rel="stylesheet" href="../styles/variables.css">
    <link rel="stylesheet" href="../styles/layout.css">
    <link rel="stylesheet" href="../styles/components.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../styles/legal.css">
    <link rel="stylesheet" href="../styles/contacts.css">
    <script src="../js/session.js"></script>
    <script src="../js/pageHeaderTemplate.js"></script>
</head>

<body class="app-layout" onload="requireLogin(); includeHTML()">
    <div class="shared-template" w3-include-html="../templates/template.html" data-active-page="contacts"></div>
    <main class="contacts-page">
        <section class="contact-list">
            <button class="btn btn-primary contact-add-btn">
                Add new contact
                <img src="../assets/icons/personAdd.svg" alt="">
            </button>
            <div id="contactList">
                <div class="contact-letter">A</div>
                <div class="contact-letter">B</div>
            </div>
        </section>

        <section class="contact-content">
            <div class="contacts-headline">
                <h1>Contacts</h1>
                <div class="contacts-headline-line"></div>
                <p>Better with a team</p>
            </div>
        </section>
    </main>
</body>

</html>
