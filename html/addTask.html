<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Task</title>
    <link rel="shortcut icon" href="../assets/icons/favorite-icon.svg" type="image/x-icon">

    <link rel="stylesheet" href="../styles/fonts.css">
    <link rel="stylesheet" href="../styles/variables.css">
    <link rel="stylesheet" href="../styles/layout.css">
    <link rel="stylesheet" href="../styles/components.css">
    <link rel="stylesheet" href="../styles/addTask.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../styles/legal.css">
    <script src="../js/session.js"></script>
    <script src="../js/pageHeaderTemplate.js"></script>
</head>

<body class="app-layout" onload="requireLogin(); includeHTML()">
    <div class="shared-template" w3-include-html="../templates/template.html" data-active-page="addTask"></div>
    <main>
        <section class="add-task-form">
            <h1>Add Task</h1>
            <div class="form-section">

                
                <div class="form-group-title">
                <label for="taskTitle">Title</label>
                <div class="form-group">
                <input type="text" id="taskTitle" name="taskTitle" required>
                </div>

                <div class="form-group-title">
                <label for="taskDescription">Description</label>
                </div>
                <div class="form-group">
                <textarea id="taskDescription" name="taskDescription" required></textarea>
                </div>

                <div class="form-group-title">
                <label for="taskDueDate">Due Date</label>
                </div>
                <div class="form-group">
                <input type="date" id="taskDueDate" name="taskDueDate" required>
                </div>

            </div>
        </section>
    </main>
</body>

</html>
