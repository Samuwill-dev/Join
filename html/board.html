<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board</title>
    <link rel="shortcut icon" href="../assets/icons/favorite-icon.svg" type="image/x-icon">

    <link rel="stylesheet" href="../styles/fonts.css">
    <link rel="stylesheet" href="../styles/variables.css">
    <link rel="stylesheet" href="../styles/layout.css">
    <link rel="stylesheet" href="../styles/components.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../styles/board.css">
    <script src="../js/session.js"></script>
    <script src="../js/pageHeaderTemplate.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/userData.js"></script>
    <script src="../js/taskData.js"></script>
    <script src="../js/bordTemplates.js"></script>
    <script src="../js/board.js"></script>
</head>

<body class="app-layout" onload="requireLogin(); includeHTML()">
    <div class="shared-template" w3-include-html="../templates/template.html" data-active-page="board"></div>
    <main class="content">
        <section class="board-header">
            <h1>Board</h1>
            <div>
                <label class="search-task" for="search-input">
                    <input class="search-task-input" id="search-input" type="text" placeholder="Find Task" />
                    <img class="search-task-icon" src="../assets/icons/search-icon.svg" alt="start searching">
                </label>
                <button class="btn btn-primary" onclick="addTaskTest()">Add task +</button>
            </div>
        </section>
        <section class="board">
            <div class="columns">
                <div class="column-head">
                    <h2>To do</h2>
                    <img class="board-plus-icon" src="../assets/icons/plus-icon.svg" alt="add task button">
                </div>
                <div class="task-section" id="todo" data-status="todo"
                    ondragover="allowDrop(event)" ondrop="saveTaskDrop(event, 'todo')">
                </div>
            </div>
            <div class="columns">
                <div class="column-head">
                    <h2>In progress</h2>
                    <img class="board-plus-icon" src="../assets/icons/plus-icon.svg" alt="add task button">
                </div>
                <div class="task-section" id="inProgress" data-status="inProgress"
                    ondragover="allowDrop(event)" ondrop="saveTaskDrop(event, 'inProgress')">
                </div>
            </div>
            <div class="columns">
                <div class="column-head">
                    <h2>Await feedback</h2>
                    <img class="board-plus-icon" src="../assets/icons/plus-icon.svg" alt="add task button">
                </div>
                <div class="task-section" id="awaitFeedback" data-status="awaitFeedback"
                    ondragover="allowDrop(event)" ondrop="saveTaskDrop(event, 'awaitFeedback')">
                </div>
            </div>
            <div class="columns">
                <div class="column-head">
                    <h2>Done</h2>
                </div>
                <div class="task-section" id="done" data-status="done"
                    ondragover="allowDrop(event)" ondrop="saveTaskDrop(event, 'done')">
                </div>
            </div>
        </section>

        <section class="dialog-section">
            <dialog open>
                <div class="task-header">
                    <span>Technical Task</span>
                    <img src="../assets/icons/close.svg" alt="close icon">
                </div>
                <h3>Headline</h3>
                <p>description</p>
                <table>
                    <tr>
                        <td>Due date:</td>
                        <td>10/05/2023</td>
                    </tr>
                    <tr>
                        <td>Priority</td>
                        <td>Medium</td>
                    </tr>
                </table>
                <h4>Assigned To:</h4>
                <div class="signed-users">
                    signed users
                </div>
                <h4>Subtasks:</h4>
                <div class="subtasks">
                    <ul class="subtasks-list">
                        <li><label><input type="checkbox"> Create the layout</label></li>
                        <li><label><input type="checkbox"> Implement the functionality</label></li>
                        <li><label><input type="checkbox"> Test the feature</label></li>
                    </ul>
                </div>
                <div>
                    <span><img src="../assets/icons/delete.svg" alt="trash can icon">Delete</span>
                    <span><img src="../assets/icons/edit.svg" alt="edit icon">Edit</span>
                </div>
            </dialog>
        </section>
    </main>
</body>

</html>
