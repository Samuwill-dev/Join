<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board</title>
    <link rel="shortcut icon" href="../assets/icons/favorite-icon.svg" type="image/x-icon">

    <link rel="stylesheet" href="../styles/fonts.css">
    <link rel="stylesheet" href="../styles/variables.css">
    <link rel="stylesheet" href="../styles/layout.css">
    <link rel="stylesheet" href="../styles/components.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../styles/legal.css">
    <link rel="stylesheet" href="../styles/board.css">
    <script src="../js/session.js"></script>
    <script src="../js/pageHeaderTemplate.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/userData.js"></script>
    <script src="../js/taskData.js"></script>
    <script src="../js/board.js"></script>
</head>

<body class="app-layout" onload="requireLogin(); includeHTML()">
    <div class="shared-template" w3-include-html="../templates/template.html" data-active-page="board"></div>
    <main class="conntent">
        <section class="board-header">
            <h1>Board</h1>
            <div>
                <label class="search-task" for="search-input">
                    <input class="search-task-input" id="search-input" type="text" placeholder="Find Task"/>
                    <img class="search-task-icon" src="../assets/icons/search-icon.svg" alt="start searching">
                </label>
                <button class="btn btn-primary" onclick="addTaskTest()">Add task +</button>
            </div>
        </section>
        <section class="board">
            <div class="columns">
                <div class="column-head">
                    <h2>To do</h2>
                    <img class="board-plus-icon" src="../assets/icons/plus-icon.svg" alt="add task button">
                </div>
                <div class="task-section">
                    <!-- tasks -->
                </div>
            </div>
            <div class="columns">
                <div class="column-head">
                    <h2>In progress</h2>
                    <img class="board-plus-icon" src="../assets/icons/plus-icon.svg" alt="add task button">
                </div>
                <div class="task-section">
                    <!-- tasks -->
                </div>
            </div>
            <div class="columns">
                <div class="column-head">
                    <h2>Await feedback</h2>
                    <img class="board-plus-icon" src="../assets/icons/plus-icon.svg" alt="add task button">
                </div>
                <div class="task-section">
                    <!-- tasks -->
                </div>
            </div>
            <div class="columns">
                <div class="column-head">
                    <h2>Done</h2>
                </div>
                <div class="task-section">
                    <!-- tasks -->
                </div>
            </div>
        </section>
    </main>
</body>

</html>
